<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나를 바라봄 카드</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:#f5f2ec;color:#343434}
.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.hero{text-align:center;padding:34px 10px 25px}
.eyebrow{letter-spacing:.15em;font-size:12px;color:#8b806f}.hero h1{font-size:42px;margin:10px 0 12px}.hero p{line-height:1.7;color:#666;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}.panel{background:#fff;border-radius:24px;padding:25px;box-shadow:0 8px 30px #0000000b}
label{display:block;font-weight:700;margin:19px 0 8px}.designs{display:flex;gap:8px}.designs button,.actions button{border:1px solid #ddd;background:#fff;border-radius:12px;padding:10px 13px;cursor:pointer}.designs button.active{background:#343434;color:#fff;border-color:#343434}
input,textarea,select{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:74px;resize:vertical}
.card{width:min(100%,430px);aspect-ratio:4/5;margin:auto;border-radius:28px;padding:35px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 35px #0002;overflow:hidden}
.card.diary{background:#fff9e9;border:1px solid #e6dcc3}.card.simple{background:#f3f7f3;border:1px solid #d8e1d8}.card.character{background:#eaf4ff;border:1px solid #d2e1ef}
.card .small{font-size:12px;letter-spacing:.12em;opacity:.65}.card h2{font-size:30px;margin:7px 0}.card .intro{font-size:14px;line-height:1.7;opacity:.75}
.item{padding:12px 0;border-top:1px solid #00000012}.item b{font-size:12px;display:block;opacity:.55;margin-bottom:5px}.item span{font-size:17px;line-height:1.5;word-break:keep-all}
.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;font-weight:700}.primary{background:#343434!important;color:#fff;border-color:#343434!important}
.note{font-size:12px;color:#777;margin-top:10px;line-height:1.5}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}.wrap{padding:20px 14px 50px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="eyebrow">생명존중 캠페인</div>
<h1>나를 바라봄</h1>
<p>내 마음을 잠시 들여다보고,<br>나를 지켜주는 것들을 기록해보세요.</p>
</header>

<div class="grid">
<section class="panel">
<h3>나만의 카드 만들기</h3>
<label>1. 디자인 선택</label>
<div class="designs">
<button class="active" data-design="diary">다이어리형</button>
<button data-design="simple">심플형</button>
<button data-design="character">캐릭터형</button>
</div>

<label for="happy">2. 나를 웃게 하는 소소한 행복</label>
<input id="happy" maxlength="40" placeholder="예: 좋아하는 음악 듣기">

<label for="sos">3. 내 마음이 보내는 SOS 신호</label>
<input id="sos" maxlength="40" placeholder="예: 잠이 잘 오지 않는다">

<label for="person">4. 나를 지켜주는 사람 또는 장소</label>
<input id="person" maxlength="40" placeholder="예: 언제든 연락할 수 있는 친구">

<label for="hope">5. 지금 나에게 해주고 싶은 말</label>
<input id="hope" maxlength="40" placeholder="예: 오늘도 잘 버티고 있어">

<label for="area">6. 도움을 받고 싶을 때</label>
<select id="area"><option>109 자살예방상담전화</option><option>정신건강위기상담전화 1577-0199</option><option>청소년상담전화 1388</option></select>

<div class="actions">
<button id="reset">🔄 다시 만들기</button>
<button class="primary" id="save">💾 카드 저장하기</button>
</div>
<div class="note">저장하기를 누르면 현재 카드가 PNG 이미지로 저장됩니다.</div>
</section>

<section class="panel">
<h3>카드 미리보기</h3>
<div id="card" class="card diary">
<div><div class="small">MY 바라봄 CARD</div><h2>나를 바라봄</h2><div class="intro">내 마음을 살펴보고<br>나를 지켜주는 것들을 기억해요.</div></div>
<div>
<div class="item"><b>나를 웃게 하는 행복</b><span id="pvHappy">좋아하는 음악 듣기</span></div>
<div class="item"><b>내 마음의 SOS</b><span id="pvSos">잠이 잘 오지 않는다</span></div>
<div class="item"><b>나를 지켜주는 사람·장소</b><span id="pvPerson">언제든 연락할 수 있는 친구</span></div>
<div class="item"><b>지금 나에게 해주고 싶은 말</b><span id="pvHope">오늘도 잘 버티고 있어</span></div>
</div>
<div class="small">도움이 필요할 때 · <span id="pvArea">109 자살예방상담전화</span></div>
</div>
</section>
</div>
</div>

<script>
const ids=["happy","sos","person","hope","area"];
const defaults={happy:"좋아하는 음악 듣기",sos:"잠이 잘 오지 않는다",person:"언제든 연락할 수 있는 친구",hope:"오늘도 잘 버티고 있어",area:"109 자살예방상담전화"};
function update(){
  ids.forEach(id=>{
    const v=document.getElementById(id).value.trim()||defaults[id];
    document.getElementById("pv"+id[0].toUpperCase()+id.slice(1)).textContent=v;
  });
}
ids.forEach(id=>document.getElementById(id).addEventListener("input",update));
document.querySelectorAll("[data-design]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-design]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 document.getElementById("card").className="card "+b.dataset.design;
});
document.getElementById("reset").onclick=()=>{
 ids.forEach(id=>document.getElementById(id).value=""); update();
};
document.getElementById("save").onclick=async()=>{
 if(!window.html2canvas){alert("저장 기능을 준비하는 중입니다. 인터넷 연결을 확인해주세요.");return}
 const canvas=await html2canvas(document.getElementById("card"),{scale:2,useCORS:true});
 const a=document.createElement("a");a.download="나를_바라봄_카드.png";a.href=canvas.toDataURL("image/png");a.click();
};
</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
</html>
